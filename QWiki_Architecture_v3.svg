<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1976d2" />
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e53935" />
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#43a047" />
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8e24aa" />
    </marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef6c00" />
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78909c" />
    </marker>
    <marker id="ah-cicd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5e35b1" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1100" fill="#f5f7fa"/>

  <!-- Title -->
  <text x="800" y="45" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1a1a2e">QWiki — RAG AI Documentation Assistant Architecture</text>

  <!-- ==================== ROW 1: User + UI + Auth ==================== -->

  <!-- User -->
  <rect x="50" y="80" width="140" height="90" rx="10" ry="10" fill="#e3f2fd" stroke="#42a5f5" stroke-width="2"/>
  <text x="120" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#1565c0">User</text>
  <text x="120" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">(Browser)</text>

  <!-- QWiki UI -->
  <rect x="280" y="70" width="280" height="110" rx="10" ry="10" fill="#bbdefb" stroke="#1976d2" stroke-width="2"/>
  <text x="420" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0d47a1">QWiki UI</text>
  <text x="420" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#333">Blazor Server</text>
  <text x="420" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">Chat · Admin · History · Feedback</text>
  <text x="420" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">Dual-Query Semantic Search</text>

  <!-- Entra ID -->
  <rect x="280" y="210" width="280" height="70" rx="10" ry="10" fill="#b3e5fc" stroke="#0288d1" stroke-width="2"/>
  <text x="420" y="245" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#01579b">Microsoft Entra ID</text>
  <text x="420" y="265" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">OIDC Authentication</text>

  <!-- GitHub Models API -->
  <rect x="660" y="80" width="260" height="100" rx="10" ry="10" fill="#e1bee7" stroke="#8e24aa" stroke-width="2"/>
  <text x="790" y="115" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#6a1b9a">GitHub Models API</text>
  <text x="790" y="138" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#333">GPT-4o-mini (Chat)</text>
  <text x="790" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">text-embedding-3-small (1536 dims)</text>

  <!-- ==================== ROW 2: Central Storage ==================== -->

  <!-- Azure AI Search -->
  <rect x="50" y="330" width="260" height="100" rx="10" ry="10" fill="#c8e6c9" stroke="#43a047" stroke-width="2"/>
  <text x="180" y="368" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#2e7d32">Azure AI Search</text>
  <text x="180" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#333">Vector Store</text>
  <text x="180" y="408" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">Hybrid: Vector + BM25 Full-Text</text>

  <!-- Azure Table Storage -->
  <rect x="380" y="330" width="300" height="130" rx="10" ry="10" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <text x="530" y="365" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#e65100">Azure Table Storage</text>
  <text x="530" y="388" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#333">IngestionCache · Progress</text>
  <text x="530" y="408" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#333">ChatHistory · Feedback</text>
  <text x="530" y="430" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">Cross-process state sync (UI / Worker)</text>
  <text x="530" y="448" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">Per-user data isolation by Entra Object ID</text>

  <!-- Azure Blob Storage -->
  <rect x="750" y="330" width="240" height="100" rx="10" ry="10" fill="#dcedc8" stroke="#689f38" stroke-width="2"/>
  <text x="870" y="368" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#33691e">Azure Blob Storage</text>
  <text x="870" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#333">Transcript Cache</text>
  <text x="870" y="408" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">JSON, keyed by docId + version</text>

  <!-- ==================== ROW 3: Worker ==================== -->

  <!-- Worker Section Background -->
  <rect x="40" y="490" width="970" height="260" fill="#fff5f5" stroke="#ffcdd2" stroke-width="1" rx="15" ry="15"/>
  <text x="60" y="518" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#c62828" font-weight="bold">INGESTION WORKER (Container App · Scale-to-Zero · Hourly)</text>

  <!-- DataIngestor -->
  <rect x="60" y="535" width="220" height="90" rx="10" ry="10" fill="#ffcdd2" stroke="#e53935" stroke-width="2"/>
  <text x="170" y="568" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#b71c1c">DataIngestor</text>
  <text x="170" y="590" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">Discovery - Extract - Chunk</text>
  <text x="170" y="607" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">- Embed - Store</text>

  <!-- ContentExtractor -->
  <rect x="310" y="535" width="220" height="90" rx="10" ry="10" fill="#ffcdd2" stroke="#e53935" stroke-width="2"/>
  <text x="420" y="568" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#b71c1c">ContentExtractor</text>
  <text x="420" y="590" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">PDF (PdfPig) · PPTX · DOCX</text>
  <text x="420" y="607" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">(OpenXml) · Wiki (Markdown)</text>

  <!-- AudioTranscriber -->
  <rect x="560" y="535" width="220" height="90" rx="10" ry="10" fill="#ffcdd2" stroke="#e53935" stroke-width="2"/>
  <text x="670" y="568" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#b71c1c">AudioTranscriber</text>
  <text x="670" y="590" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">FFmpeg - Azure Speech SDK</text>
  <text x="670" y="607" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">MP4/MKV - [HH:MM:SS] chunks</text>

  <!-- IngestionProgressService -->
  <rect x="810" y="535" width="180" height="90" rx="10" ry="10" fill="#ffcdd2" stroke="#e53935" stroke-width="2"/>
  <text x="900" y="565" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#b71c1c">Progress</text>
  <text x="900" y="585" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#b71c1c">Service</text>
  <text x="900" y="607" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">Real-time via Table Storage</text>

  <!-- Chunking detail -->
  <rect x="60" y="660" width="430" height="70" rx="10" ry="10" fill="#fff0f0" stroke="#ef9a9a" stroke-width="2"/>
  <text x="275" y="688" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#c62828">~300 words per chunk · 50-word overlap · Incremental ingestion</text>
  <text x="275" y="710" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">SHA256 hash (Wiki) · LastModified (SharePoint) · 0-record retry</text>

  <!-- ==================== ROW 4: Data Sources ==================== -->

  <!-- Data Sources Section Background -->
  <rect x="40" y="790" width="700" height="130" fill="#fff8e1" stroke="#ffe082" stroke-width="1" rx="15" ry="15"/>
  <text x="60" y="818" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e65100" font-weight="bold">DATA SOURCES</text>

  <!-- Azure DevOps Wiki -->
  <rect x="60" y="835" width="200" height="70" rx="10" ry="10" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2"/>
  <text x="160" y="865" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#bf360c">Azure DevOps Wiki</text>
  <text x="160" y="885" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">REST API · Markdown pages</text>

  <!-- SharePoint Docs -->
  <rect x="290" y="835" width="200" height="70" rx="10" ry="10" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2"/>
  <text x="390" y="865" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#bf360c">SharePoint Docs</text>
  <text x="390" y="885" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">Graph API · PDF/PPTX/DOCX</text>

  <!-- SharePoint Videos -->
  <rect x="520" y="835" width="200" height="70" rx="10" ry="10" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2"/>
  <text x="620" y="865" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#bf360c">SharePoint Videos</text>
  <text x="620" y="885" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">MP4/MKV · Speech-to-Text</text>

  <!-- ==================== CI/CD Section ==================== -->

  <rect x="1060" y="490" width="500" height="430" fill="#ede7f6" stroke="#b39ddb" stroke-width="1" rx="15" ry="15"/>
  <text x="1080" y="518" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#4527a0" font-weight="bold">CI/CD — GITHUB ACTIONS</text>

  <!-- Push to master -->
  <rect x="1200" y="535" width="220" height="65" rx="10" ry="10" fill="#d1c4e9" stroke="#5e35b1" stroke-width="2"/>
  <text x="1310" y="565" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#311b92">Push to master</text>
  <text x="1310" y="585" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">or manual workflow_dispatch</text>

  <!-- UI Workflow -->
  <rect x="1080" y="640" width="220" height="80" rx="10" ry="10" fill="#d1c4e9" stroke="#5e35b1" stroke-width="2"/>
  <text x="1190" y="668" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#311b92">azure-deploy.yml</text>
  <text x="1190" y="690" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">dotnet publish - zip deploy</text>
  <text x="1190" y="706" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">via publish profile</text>

  <!-- Worker Workflow -->
  <rect x="1320" y="640" width="220" height="80" rx="10" ry="10" fill="#d1c4e9" stroke="#5e35b1" stroke-width="2"/>
  <text x="1430" y="668" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#311b92">azure-deploy-worker.yml</text>
  <text x="1430" y="690" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">az acr build - Docker image</text>
  <text x="1430" y="706" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">- update Container App</text>

  <!-- App Service target -->
  <rect x="1080" y="770" width="220" height="60" rx="10" ry="10" fill="#bbdefb" stroke="#1976d2" stroke-width="2"/>
  <text x="1190" y="800" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#0d47a1">App Service</text>
  <text x="1190" y="818" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">QWiki UI · B1 Linux</text>

  <!-- ACR -->
  <rect x="1320" y="770" width="100" height="60" rx="10" ry="10" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <text x="1370" y="800" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#e65100">ACR</text>
  <text x="1370" y="818" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">qwikiacr</text>

  <!-- Container App target -->
  <rect x="1440" y="770" width="100" height="60" rx="10" ry="10" fill="#ffcdd2" stroke="#e53935" stroke-width="2"/>
  <text x="1490" y="798" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#b71c1c">Container</text>
  <text x="1490" y="818" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">App</text>

  <!-- Azure Speech -->
  <rect x="1080" y="870" width="200" height="60" rx="10" ry="10" fill="#e1bee7" stroke="#8e24aa" stroke-width="2"/>
  <text x="1180" y="898" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#6a1b9a">Azure Speech Service</text>
  <text x="1180" y="915" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">S0 · Continuous Recognition</text>

  <!-- Supported File Types -->
  <rect x="1310" y="870" width="230" height="60" rx="10" ry="10" fill="#ffffff" stroke="#bdbdbd" stroke-width="2"/>
  <text x="1425" y="895" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#333">Record Types</text>
  <text x="1425" y="915" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">WIKI · PDF · PPTX · DOCX · VIDEO</text>

  <!-- ==================== ARROWS ==================== -->

  <!-- User to UI -->
  <path d="M 190 125 H 278" fill="none" stroke="#1976d2" stroke-width="2.5" marker-end="url(#ah-blue)"/>
  <text x="232" y="115" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555" font-weight="600">Query</text>

  <!-- UI to Auth -->
  <path d="M 420 180 V 208" fill="none" stroke="#78909c" stroke-width="2.5" marker-end="url(#ah-gray)"/>

  <!-- UI to GitHub Models -->
  <path d="M 560 125 H 658" fill="none" stroke="#8e24aa" stroke-width="2.5" marker-end="url(#ah-purple)"/>
  <text x="609" y="115" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555" font-weight="600">LLM + Embed</text>

  <!-- UI to Search -->
  <path d="M 350 180 V 290 H 180 V 328" fill="none" stroke="#43a047" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <text x="195" y="298" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555" font-weight="600">Dual-Query Search</text>

  <!-- UI to Table Storage -->
  <path d="M 490 180 V 290 H 530 V 328" fill="none" stroke="#ef6c00" stroke-width="2.5" marker-end="url(#ah-orange)"/>

  <!-- Worker to Search -->
  <path d="M 100 535 V 432" fill="none" stroke="#43a047" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <text x="105" y="485" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555" font-weight="600">Upsert</text>

  <!-- Worker to Table Storage -->
  <path d="M 900 535 V 475 H 530 V 462" fill="none" stroke="#ef6c00" stroke-width="2.5" marker-end="url(#ah-orange)"/>

  <!-- Worker to Blob Storage -->
  <path d="M 670 535 V 475 H 870 V 432" fill="none" stroke="#43a047" stroke-width="2.5" marker-end="url(#ah-green)"/>
  <text x="770" y="468" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555" font-weight="600">Cache</text>

  <!-- Worker to GitHub Models (embeddings) -->
  <path d="M 420 535 V 475 H 790 V 182" fill="none" stroke="#8e24aa" stroke-width="2.5" marker-end="url(#ah-purple)"/>
  <text x="810" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555" font-weight="600">Embeddings</text>

  <!-- Data Sources to Worker -->
  <path d="M 160 835 V 752" fill="none" stroke="#e53935" stroke-width="2.5" marker-end="url(#ah-red)"/>
  <path d="M 390 835 V 752" fill="none" stroke="#e53935" stroke-width="2.5" marker-end="url(#ah-red)"/>
  <path d="M 620 835 V 752" fill="none" stroke="#e53935" stroke-width="2.5" marker-end="url(#ah-red)"/>

  <!-- AudioTranscriber to Speech -->
  <path d="M 780 580 H 1020 V 898 H 1078" fill="none" stroke="#8e24aa" stroke-width="2.5" marker-end="url(#ah-purple)"/>

  <!-- CI/CD Arrows -->
  <path d="M 1250 600 V 638" fill="none" stroke="#5e35b1" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#ah-cicd)"/>
  <path d="M 1370 600 V 638" fill="none" stroke="#5e35b1" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#ah-cicd)"/>

  <!-- UI Workflow to App Service -->
  <path d="M 1190 720 V 768" fill="none" stroke="#5e35b1" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#ah-cicd)"/>
  <!-- Worker Workflow to ACR -->
  <path d="M 1370 720 V 768" fill="none" stroke="#5e35b1" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#ah-cicd)"/>
  <!-- ACR to Container App -->
  <path d="M 1420 800 H 1438" fill="none" stroke="#5e35b1" stroke-width="2.5" stroke-dasharray="8,4" marker-end="url(#ah-cicd)"/>

  <!-- Legend -->
  <rect x="40" y="960" width="1520" height="100" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="10" ry="10"/>
  <text x="60" y="990" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#333">Technology Stack</text>
  <text x="60" y="1018" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#333">.NET 9.0 · Blazor Server · Azure AI Search · Azure Table/Blob Storage</text>
  <text x="60" y="1042" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#333">GitHub Models (GPT-4o-mini + text-embedding-3-small) · Azure Speech SDK · FFmpeg · Microsoft Graph · Entra ID (OIDC)</text>
</svg>
