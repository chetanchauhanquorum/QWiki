<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .font { font-family: 'Segoe UI', 'Arial', sans-serif; }
      .title { font-size: 28px; font-weight: bold; fill: #1a1a2e; }
      .subtitle { font-size: 17px; font-weight: bold; }
      .label { font-size: 14px; fill: #333; }
      .small-label { font-size: 12px; fill: #666; }
      .arrow-label { font-size: 12px; fill: #555; font-weight: 600; }

      .bg { fill: #f5f7fa; }
      .section-bg { rx: 12; ry: 12; }
      .component { rx: 10; ry: 10; stroke-width: 2; }

      .user-fill { fill: #e3f2fd; stroke: #42a5f5; }
      .ui-fill { fill: #bbdefb; stroke: #1976d2; }
      .worker-fill { fill: #ffcdd2; stroke: #e53935; }
      .search-fill { fill: #c8e6c9; stroke: #43a047; }
      .storage-fill { fill: #fff9c4; stroke: #f9a825; }
      .api-fill { fill: #e1bee7; stroke: #8e24aa; }
      .source-fill { fill: #ffe0b2; stroke: #ef6c00; }
      .auth-fill { fill: #b3e5fc; stroke: #0288d1; }
      .cicd-fill { fill: #d1c4e9; stroke: #5e35b1; }
      .blob-fill { fill: #dcedc8; stroke: #689f38; }

      .arrow { stroke-width: 2.5; fill: none; }
      .arrow-blue { stroke: #1976d2; }
      .arrow-red { stroke: #e53935; }
      .arrow-green { stroke: #43a047; }
      .arrow-purple { stroke: #8e24aa; }
      .arrow-orange { stroke: #ef6c00; }
      .arrow-gray { stroke: #78909c; }
      .arrow-cicd { stroke: #5e35b1; stroke-dasharray: 8,4; }
    </style>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1976d2" />
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e53935" />
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#43a047" />
    </marker>
    <marker id="ah-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8e24aa" />
    </marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef6c00" />
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#78909c" />
    </marker>
    <marker id="ah-cicd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5e35b1" />
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1100" class="bg"/>

  <!-- Title -->
  <text x="800" y="45" text-anchor="middle" class="font title">QWiki — RAG AI Documentation Assistant Architecture</text>

  <!-- ==================== ROW 1: User + UI + Auth ==================== -->

  <!-- User -->
  <rect x="50" y="80" width="140" height="90" class="component user-fill" filter="url(#shadow)"/>
  <text x="120" y="118" text-anchor="middle" class="font subtitle" fill="#1565c0">User</text>
  <text x="120" y="140" text-anchor="middle" class="font small-label">(Browser)</text>

  <!-- QWiki UI -->
  <rect x="280" y="70" width="280" height="110" class="component ui-fill" filter="url(#shadow)"/>
  <text x="420" y="105" text-anchor="middle" class="font subtitle" fill="#0d47a1">QWiki UI</text>
  <text x="420" y="125" text-anchor="middle" class="font label">Blazor Server</text>
  <text x="420" y="145" text-anchor="middle" class="font small-label">Chat · Admin · History · Feedback</text>
  <text x="420" y="162" text-anchor="middle" class="font small-label">Dual-Query Semantic Search</text>

  <!-- Entra ID -->
  <rect x="280" y="210" width="280" height="70" class="component auth-fill" filter="url(#shadow)"/>
  <text x="420" y="245" text-anchor="middle" class="font subtitle" fill="#01579b">Microsoft Entra ID</text>
  <text x="420" y="265" text-anchor="middle" class="font small-label">OIDC Authentication</text>

  <!-- GitHub Models API -->
  <rect x="660" y="80" width="260" height="100" class="component api-fill" filter="url(#shadow)"/>
  <text x="790" y="115" text-anchor="middle" class="font subtitle" fill="#6a1b9a">GitHub Models API</text>
  <text x="790" y="138" text-anchor="middle" class="font label">GPT-4o-mini (Chat)</text>
  <text x="790" y="158" text-anchor="middle" class="font small-label">text-embedding-3-small (1536 dims)</text>

  <!-- ==================== ROW 2: Central Storage ==================== -->

  <!-- Azure AI Search -->
  <rect x="50" y="330" width="260" height="100" class="component search-fill" filter="url(#shadow)"/>
  <text x="180" y="368" text-anchor="middle" class="font subtitle" fill="#2e7d32">Azure AI Search</text>
  <text x="180" y="390" text-anchor="middle" class="font label">Vector Store</text>
  <text x="180" y="408" text-anchor="middle" class="font small-label">Hybrid: Vector + BM25 Full-Text</text>

  <!-- Azure Table Storage -->
  <rect x="380" y="330" width="300" height="130" class="component storage-fill" filter="url(#shadow)"/>
  <text x="530" y="365" text-anchor="middle" class="font subtitle" fill="#e65100">Azure Table Storage</text>
  <text x="530" y="388" text-anchor="middle" class="font label">IngestionCache · Progress</text>
  <text x="530" y="408" text-anchor="middle" class="font label">ChatHistory · Feedback</text>
  <text x="530" y="430" text-anchor="middle" class="font small-label">Cross-process state sync (UI ↔ Worker)</text>
  <text x="530" y="448" text-anchor="middle" class="font small-label">Per-user data isolation by Entra Object ID</text>

  <!-- Azure Blob Storage -->
  <rect x="750" y="330" width="240" height="100" class="component blob-fill" filter="url(#shadow)"/>
  <text x="870" y="368" text-anchor="middle" class="font subtitle" fill="#33691e">Azure Blob Storage</text>
  <text x="870" y="390" text-anchor="middle" class="font label">Transcript Cache</text>
  <text x="870" y="408" text-anchor="middle" class="font small-label">JSON, keyed by docId + version</text>

  <!-- ==================== ROW 3: Worker ==================== -->

  <!-- Worker Section Background -->
  <rect x="40" y="490" width="970" height="260" fill="#fff5f5" stroke="#ffcdd2" stroke-width="1" rx="15" ry="15"/>
  <text x="60" y="518" class="font small-label" fill="#c62828" font-weight="bold">INGESTION WORKER (Container App · Scale-to-Zero · Hourly)</text>

  <!-- DataIngestor -->
  <rect x="60" y="535" width="220" height="90" class="component worker-fill" filter="url(#shadow)"/>
  <text x="170" y="568" text-anchor="middle" class="font subtitle" fill="#b71c1c">DataIngestor</text>
  <text x="170" y="590" text-anchor="middle" class="font small-label">Discovery → Extract → Chunk</text>
  <text x="170" y="607" text-anchor="middle" class="font small-label">→ Embed → Store</text>

  <!-- ContentExtractor -->
  <rect x="310" y="535" width="220" height="90" class="component worker-fill" filter="url(#shadow)"/>
  <text x="420" y="568" text-anchor="middle" class="font subtitle" fill="#b71c1c">ContentExtractor</text>
  <text x="420" y="590" text-anchor="middle" class="font small-label">PDF (PdfPig) · PPTX · DOCX</text>
  <text x="420" y="607" text-anchor="middle" class="font small-label">(OpenXml) · Wiki (Markdown)</text>

  <!-- AudioTranscriber -->
  <rect x="560" y="535" width="220" height="90" class="component worker-fill" filter="url(#shadow)"/>
  <text x="670" y="568" text-anchor="middle" class="font subtitle" fill="#b71c1c">AudioTranscriber</text>
  <text x="670" y="590" text-anchor="middle" class="font small-label">FFmpeg → Azure Speech SDK</text>
  <text x="670" y="607" text-anchor="middle" class="font small-label">MP4/MKV → [HH:MM:SS] chunks</text>

  <!-- IngestionProgressService -->
  <rect x="810" y="535" width="180" height="90" class="component worker-fill" filter="url(#shadow)"/>
  <text x="900" y="565" text-anchor="middle" class="font subtitle" fill="#b71c1c">Progress</text>
  <text x="900" y="585" text-anchor="middle" class="font subtitle" fill="#b71c1c">Service</text>
  <text x="900" y="607" text-anchor="middle" class="font small-label">Real-time via Table Storage</text>

  <!-- Chunking detail -->
  <rect x="60" y="660" width="430" height="70" class="component" style="fill:#fff0f0; stroke:#ef9a9a;" filter="url(#shadow)"/>
  <text x="275" y="688" text-anchor="middle" class="font label" fill="#c62828">~300 words per chunk · 50-word overlap · Incremental ingestion</text>
  <text x="275" y="710" text-anchor="middle" class="font small-label">SHA256 hash (Wiki) · LastModified (SharePoint) · 0-record retry</text>

  <!-- ==================== ROW 4: Data Sources ==================== -->

  <!-- Data Sources Section Background -->
  <rect x="40" y="790" width="700" height="130" fill="#fff8e1" stroke="#ffe082" stroke-width="1" rx="15" ry="15"/>
  <text x="60" y="818" class="font small-label" fill="#e65100" font-weight="bold">DATA SOURCES</text>

  <!-- Azure DevOps Wiki -->
  <rect x="60" y="835" width="200" height="70" class="component source-fill" filter="url(#shadow)"/>
  <text x="160" y="865" text-anchor="middle" class="font subtitle" fill="#bf360c">Azure DevOps Wiki</text>
  <text x="160" y="885" text-anchor="middle" class="font small-label">REST API · Markdown pages</text>

  <!-- SharePoint Docs -->
  <rect x="290" y="835" width="200" height="70" class="component source-fill" filter="url(#shadow)"/>
  <text x="390" y="865" text-anchor="middle" class="font subtitle" fill="#bf360c">SharePoint Docs</text>
  <text x="390" y="885" text-anchor="middle" class="font small-label">Graph API · PDF/PPTX/DOCX</text>

  <!-- SharePoint Videos -->
  <rect x="520" y="835" width="200" height="70" class="component source-fill" filter="url(#shadow)"/>
  <text x="620" y="865" text-anchor="middle" class="font subtitle" fill="#bf360c">SharePoint Videos</text>
  <text x="620" y="885" text-anchor="middle" class="font small-label">MP4/MKV · Speech-to-Text</text>

  <!-- ==================== CI/CD Section ==================== -->

  <rect x="1060" y="490" width="500" height="430" fill="#ede7f6" stroke="#b39ddb" stroke-width="1" rx="15" ry="15"/>
  <text x="1080" y="518" class="font small-label" fill="#4527a0" font-weight="bold">CI/CD — GITHUB ACTIONS</text>

  <!-- Push to master -->
  <rect x="1200" y="535" width="220" height="65" class="component cicd-fill" filter="url(#shadow)"/>
  <text x="1310" y="565" text-anchor="middle" class="font subtitle" fill="#311b92">Push to master</text>
  <text x="1310" y="585" text-anchor="middle" class="font small-label">or manual workflow_dispatch</text>

  <!-- UI Workflow -->
  <rect x="1080" y="640" width="220" height="80" class="component cicd-fill" filter="url(#shadow)"/>
  <text x="1190" y="668" text-anchor="middle" class="font subtitle" fill="#311b92">azure-deploy.yml</text>
  <text x="1190" y="690" text-anchor="middle" class="font small-label">dotnet publish → zip deploy</text>
  <text x="1190" y="706" text-anchor="middle" class="font small-label">via publish profile</text>

  <!-- Worker Workflow -->
  <rect x="1320" y="640" width="220" height="80" class="component cicd-fill" filter="url(#shadow)"/>
  <text x="1430" y="668" text-anchor="middle" class="font subtitle" fill="#311b92">azure-deploy-worker.yml</text>
  <text x="1430" y="690" text-anchor="middle" class="font small-label">az acr build → Docker image</text>
  <text x="1430" y="706" text-anchor="middle" class="font small-label">→ update Container App</text>

  <!-- App Service target -->
  <rect x="1080" y="770" width="220" height="60" class="component ui-fill" filter="url(#shadow)"/>
  <text x="1190" y="800" text-anchor="middle" class="font subtitle" fill="#0d47a1">App Service</text>
  <text x="1190" y="818" text-anchor="middle" class="font small-label">QWiki UI · B1 Linux</text>

  <!-- ACR -->
  <rect x="1320" y="770" width="100" height="60" class="component storage-fill" filter="url(#shadow)"/>
  <text x="1370" y="800" text-anchor="middle" class="font subtitle" fill="#e65100">ACR</text>
  <text x="1370" y="818" text-anchor="middle" class="font small-label">qwikiacr</text>

  <!-- Container App target -->
  <rect x="1440" y="770" width="100" height="60" class="component worker-fill" filter="url(#shadow)"/>
  <text x="1490" y="798" text-anchor="middle" class="font subtitle" fill="#b71c1c">Container</text>
  <text x="1490" y="818" text-anchor="middle" class="font small-label">App</text>

  <!-- Azure Speech -->
  <rect x="1080" y="870" width="200" height="60" class="component api-fill" filter="url(#shadow)"/>
  <text x="1180" y="898" text-anchor="middle" class="font subtitle" fill="#6a1b9a">Azure Speech Service</text>
  <text x="1180" y="915" text-anchor="middle" class="font small-label">S0 · Continuous Recognition</text>

  <!-- Supported File Types -->
  <rect x="1310" y="870" width="230" height="60" class="component" style="fill:#fff; stroke:#bdbdbd;" filter="url(#shadow)"/>
  <text x="1425" y="895" text-anchor="middle" class="font subtitle" fill="#333">Record Types</text>
  <text x="1425" y="915" text-anchor="middle" class="font small-label">WIKI · PDF · PPTX · DOCX · VIDEO</text>

  <!-- ==================== ARROWS ==================== -->

  <!-- User → UI -->
  <path d="M 190 125 H 278" class="arrow arrow-blue" marker-end="url(#ah-blue)"/>
  <text x="232" y="115" text-anchor="middle" class="font arrow-label">Query</text>

  <!-- UI → Auth -->
  <path d="M 420 180 V 208" class="arrow arrow-gray" marker-end="url(#ah-gray)"/>

  <!-- UI → GitHub Models -->
  <path d="M 560 125 H 658" class="arrow arrow-purple" marker-end="url(#ah-purple)"/>
  <text x="609" y="115" text-anchor="middle" class="font arrow-label">LLM + Embed</text>

  <!-- UI → Search -->
  <path d="M 350 180 V 290 H 180 V 328" class="arrow arrow-green" marker-end="url(#ah-green)"/>
  <text x="185" y="298" text-anchor="middle" class="font arrow-label" text-anchor="start">Dual-Query Search</text>

  <!-- UI → Table Storage -->
  <path d="M 490 180 V 290 H 530 V 328" class="arrow arrow-orange" marker-end="url(#ah-orange)"/>

  <!-- Worker → Search -->
  <path d="M 100 535 V 432" class="arrow arrow-green" marker-end="url(#ah-green)"/>
  <text x="105" y="485" class="font arrow-label" text-anchor="start">Upsert</text>

  <!-- Worker → Table Storage -->
  <path d="M 900 535 V 475 H 530 V 462" class="arrow arrow-orange" marker-end="url(#ah-orange)"/>

  <!-- Worker → Blob Storage -->
  <path d="M 670 535 V 475 H 870 V 432" class="arrow arrow-green" marker-end="url(#ah-green)"/>
  <text x="770" y="468" class="font arrow-label">Cache</text>

  <!-- Worker → GitHub Models (embeddings) -->
  <path d="M 420 535 V 475 H 790 V 182" class="arrow arrow-purple" marker-end="url(#ah-purple)"/>
  <text x="810" y="260" class="font arrow-label">Embeddings</text>

  <!-- Data Sources → Worker -->
  <path d="M 160 835 V 752" class="arrow arrow-red" marker-end="url(#ah-red)"/>
  <path d="M 390 835 V 752" class="arrow arrow-red" marker-end="url(#ah-red)"/>
  <path d="M 620 835 V 752" class="arrow arrow-red" marker-end="url(#ah-red)"/>

  <!-- AudioTranscriber → Speech -->
  <path d="M 780 580 H 1020 V 898 H 1078" class="arrow arrow-purple" marker-end="url(#ah-purple)"/>

  <!-- CI/CD Arrows -->
  <path d="M 1250 600 V 638" class="arrow arrow-cicd" marker-end="url(#ah-cicd)"/>
  <path d="M 1370 600 V 638" class="arrow arrow-cicd" marker-end="url(#ah-cicd)"/>

  <!-- UI Workflow → App Service -->
  <path d="M 1190 720 V 768" class="arrow arrow-cicd" marker-end="url(#ah-cicd)"/>
  <!-- Worker Workflow → ACR -->
  <path d="M 1370 720 V 768" class="arrow arrow-cicd" marker-end="url(#ah-cicd)"/>
  <!-- ACR → Container App -->
  <path d="M 1420 800 H 1438" class="arrow arrow-cicd" marker-end="url(#ah-cicd)"/>

  <!-- Legend -->
  <rect x="40" y="960" width="1520" height="100" fill="#fff" stroke="#e0e0e0" stroke-width="1" rx="10" ry="10"/>
  <text x="60" y="990" class="font subtitle" fill="#333">Technology Stack</text>
  <text x="60" y="1018" class="font label">.NET 9.0 · Blazor Server · Azure AI Search · Azure Table/Blob Storage</text>
  <text x="60" y="1042" class="font label">GitHub Models (GPT-4o-mini + text-embedding-3-small) · Azure Speech SDK · FFmpeg · Microsoft Graph · Entra ID (OIDC)</text>
</svg>
